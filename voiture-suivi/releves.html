<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Relevés mensuels — Corsa-e</title><script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f5f7fa;color:#172033}.panel{background:white;padding:20px;margin:16px 0;border-radius:16px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}label{display:grid;gap:6px;font-weight:600}input,button{padding:11px;border:1px solid #ccd2dc;border-radius:10px;font:inherit}button{cursor:pointer;background:#172033;color:white}.wide{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.hint{color:#657084}</style></head><body><h1>Relevés mensuels Corsa-e</h1><p class="hint">À remplir chaque mois, idéalement le 8. Les données sont enregistrées sur cet appareil.</p><section class="panel"><h2>Nouveau relevé</h2><form id="f"><label>Date<input id="date" type="date" required></label><label>Kilométrage total (km)<input id="km" type="number" min="0" required></label><label>Conso moyenne (kWh/100 km)<input id="conso" type="number" min="0" step=".1" required></label><label>Vitesse moyenne (km/h)<input id="speed" type="number" min="0" step=".1" required></label><label>Température moyenne (°C)<input id="temp" type="number" step=".1"></label><div class="wide"><button>Ajouter le relevé</button></div></form></section><section class="panel"><h2>Évolution</h2><canvas id="chart"></canvas></section><section class="panel"><h2>Historique</h2><table><thead><tr><th>Date</th><th>Km total</th><th>Conso</th><th>Vitesse</th><th>Temp.</th><th></th></tr></thead><tbody id="rows"></tbody></table></section><script>const K="corsa-e-releves-mensuels-v1";let data=JSON.parse(localStorage.getItem(K)||"[]");const $=x=>document.getElementById(x);$("date").value=new Date().toISOString().slice(0,10);function save(){localStorage.setItem(K,JSON.stringify(data))}function render(){data.sort((a,b)=>a.date.localeCompare(b.date));$("rows").innerHTML=data.slice().reverse().map((x,i)=>{const real=data.length-1-i;return "<tr><td>"+x.date+"</td><td>"+x.km+" km</td><td>"+x.conso+" kWh/100</td><td>"+x.speed+" km/h</td><td>"+(x.temp??"—")+" °C</td><td><button onclick='del("+real+")'>Suppr.</button></td></tr>"}).join("");new Chart($("chart"),{type:"line",data:{labels:data.map(x=>x.date),datasets:[{label:"Conso kWh/100 km",data:data.map(x=>x.conso)},{label:"Vitesse km/h",data:data.map(x=>x.speed)}]},options:{responsive:true,scales:{y:{beginAtZero:true}}}})}function del(i){data.splice(i,1);save();location.reload()}$("f").onsubmit=e=>{e.preventDefault();data.push({date:$("date").value,km:+$("km").value,conso:+$("conso").value,speed:+$("speed").value,temp:$("temp").value===""?null:+$("temp").value});save();render();e.target.reset();$("date").value=new Date().toISOString().slice(0,10)};render()</script></body></html>
